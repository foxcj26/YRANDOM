id: ima.yrand
name: YRANDOM
description: >-
  ClassIsland 课堂随机点名插件。名字在同一条提醒上原地滚动换名、两段式定格连滑；
  债务校正 + Gumbel 加权 + 冷落滑窗的公平算法，麦克风声浪加成，结果可复算自证。
entranceAssembly: "ClassIsland.YRAND.dll"
url: https://github.com/foxcj26/YRANDOM
repoOwner: foxcj26
repoName: YRANDOM
assetsRoot: main/plugin
version: 2.0.0.19
apiVersion: 2.0.0.0
author: foxcj26 与 workbuddy
icon: icon.png
readme: README.md
supportedOSPlatforms:
  - Windows
  - Linux
  - OSX

