<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
<rect width="1000" height="340" rx="16" fill="#141418"/>
<text x="30" y="36" fill="#EDEDF5" font-size="19" font-weight="700">麦克风声浪 → 连滑概率加成</text>
<text x="30" y="58" fill="#9A9AAE" font-size="12.5">16 kHz / 100 ms 窗 RMS → dBFS 指数平滑 · v2.0.0.12 起可在设置页切换「随声浪（随机）/ 固定」两种加速率</text>

<!-- 图例 -->
<rect x="700" y="27" width="16" height="4" rx="2" fill="#B9A8FF"/>
<text x="722" y="33" fill="#D8CFF5" font-size="11.5">随声浪（随机）· 线性爬升</text>
<rect x="700" y="45" width="16" height="4" rx="2" fill="#4FC3F7"/>
<text x="722" y="51" fill="#BFE4F7" font-size="11.5">固定 · 过阈值即阶跃</text>

<!-- 网格 -->
<g stroke="#34343F" stroke-width="1" stroke-dasharray="3 5">
  <line x1="90" y1="80"  x2="950" y2="80"/>
  <line x1="90" y1="97"  x2="950" y2="97"/>
  <line x1="90" y1="165" x2="950" y2="165"/>
</g>
<!-- 坐标轴 -->
<g stroke="#6A6A80" stroke-width="1.5">
  <line x1="90" y1="76" x2="90" y2="250"/>
  <line x1="90" y1="250" x2="950" y2="250"/>
</g>
<!-- 阈值 / 饱和竖线 -->
<g stroke="#8B76D6" stroke-width="1.2" stroke-dasharray="5 4">
  <line x1="448" y1="76" x2="448" y2="250"/>
  <line x1="778" y1="76" x2="778" y2="250"/>
</g>
<!-- y 刻度 -->
<g fill="#9A9AAE" font-size="10.5" text-anchor="end">
  <text x="82" y="84">+50%</text>
  <text x="82" y="101">+45%</text>
  <text x="82" y="169">+25%</text>
</g>
<text x="30" y="72" fill="#9A9AAE" font-size="10.5">加成</text>
<!-- x 刻度 -->
<g fill="#9A9AAE" font-size="10.5" text-anchor="middle">
  <text x="90"  y="266">-60</text>
  <text x="448" y="266">-35 阈值</text>
  <text x="778" y="266">-12 饱和</text>
  <text x="950" y="266">0 dBFS</text>
</g>

<!-- 固定模式：阶跃到 +25% -->
<path d="M90 250 L448 250 L448 165 L950 165" fill="none" stroke="#4FC3F7" stroke-width="3" stroke-linejoin="round"/>
<!-- 随机模式：线性爬升到 +45% -->
<path d="M90 250 L448 250 L778 97 L950 97" fill="none" stroke="#B9A8FF" stroke-width="3" stroke-linejoin="round"/>
<circle cx="778" cy="97" r="4.5" fill="#B9A8FF"/>
<circle cx="448" cy="165" r="4.5" fill="#4FC3F7"/>

<!-- 底部注释 -->
<rect x="30" y="278" width="940" height="46" rx="10" fill="#2A2140" stroke="#7C4DFF" stroke-width="1.2"/>
<text x="48" y="298" fill="#D8CFF5" font-size="11.5">p_eff = min(100%, 基础连滑概率 p + 加成)；声浪同时让滚动提速最多 35%。无麦克风 / 拒绝授权 / 非 Windows 一律静默降级。</text>
<text x="48" y="316" fill="#FFD54F" font-size="11.5" font-weight="700">关键隔离：加成只决定「连不连滑、等多久」，中签者早在点击瞬间由公平算法锁定 —— 喊得再响也换不了人。</text>
</svg>
