<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
<rect width="1000" height="380" rx="16" fill="#141418"/>
<text x="30" y="36" fill="#EDEDF5" font-size="19" font-weight="700">公平抽样内核 · 债务校正 + 冷落兜底</text>
<text x="30" y="58" fill="#9A9AAE" font-size="12.5">把「一轮内不重复」升级为「任意窗口都有硬上界」；随机性全部来自第 ① 步的种子派生流</text>

<!-- 左：公式卡 -->
<rect x="30" y="76" width="440" height="274" rx="14" fill="#20202B" stroke="#3A3A48"/>
<text x="52" y="106" fill="#B9A8FF" font-size="14" font-weight="700">抽样规则</text>
<line x1="52" y1="118" x2="448" y2="118" stroke="#3A3A48"/>
<g font-family="'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="13.5" fill="#EDEDF5">
  <text x="52" y="146">due_i  = t/N − c_i</text>
  <text x="52" y="190">score_i = β·due_i + Gumbel(U_i)</text>
  <text x="52" y="232">U_i    = HMAC-SHA256(S, i)</text>
  <text x="52" y="274">M      = { i : t − last_t[i] ≥ W }</text>
</g>
<g font-size="11.5" fill="#9A9AAE">
  <text x="52" y="164">理想均分 − 该人实抽次数；Σdue 恒为 0</text>
  <text x="52" y="208">Gumbel(u) = −ln(−ln u)，噪声保持不可预测</text>
  <text x="52" y="250">确定性 DRBG，种子公开后任何人可复算</text>
  <text x="52" y="292">「濒临冷落」集合：连续 W 次未被抽中</text>
</g>
<rect x="52" y="306" width="396" height="32" rx="8" fill="#2A2140"/>
<text x="64" y="327" fill="#D8CFF5" font-size="11.5">M 非空 → M 内随机取一人（硬兜底）；否则 → argmax score</text>

<!-- 右：债务条 -->
<rect x="490" y="76" width="480" height="274" rx="14" fill="#20202B" stroke="#3A3A48"/>
<text x="512" y="106" fill="#B9A8FF" font-size="14" font-weight="700">公平账本 · 10 人债务快照</text>
<line x1="512" y1="118" x2="948" y2="118" stroke="#3A3A48"/>
<line x1="730" y1="132" x2="730" y2="330" stroke="#6A6A80" stroke-width="1" stroke-dasharray="3 4"/>
<text x="730" y="128" fill="#9A9AAE" font-size="10.5" text-anchor="middle">0</text>

<g font-size="11" fill="#C9C9D6">
  <text x="512" y="141">张三</text><text x="512" y="161">李四</text><text x="512" y="181">王五</text>
  <text x="512" y="201">赵六</text><text x="512" y="221">钱七</text><text x="512" y="241">孙八</text>
  <text x="512" y="261">周九</text><text x="512" y="281">吴十</text><text x="512" y="301">郑一</text>
</g>
<g>
  <rect x="730" y="131" width="54" height="11" rx="3" fill="#81C784"/>
  <rect x="712" y="151" width="18" height="11" rx="3" fill="#EF9A9A"/>
  <rect x="730" y="171" width="31" height="11" rx="3" fill="#81C784"/>
  <rect x="680" y="191" width="50" height="11" rx="3" fill="#EF9A9A"/>
  <rect x="730" y="211" width="9"  height="11" rx="3" fill="#81C784"/>
  <rect x="730" y="231" width="40" height="11" rx="3" fill="#81C784"/>
  <rect x="703" y="251" width="27" height="11" rx="3" fill="#EF9A9A"/>
  <rect x="730" y="271" width="18" height="11" rx="3" fill="#81C784"/>
  <rect x="694" y="291" width="36" height="11" rx="3" fill="#EF9A9A"/>
</g>
<text x="512" y="321" fill="#FFD54F" font-size="11" font-weight="700">王二</text>
<rect x="730" y="311" width="68" height="11" rx="3" fill="#FFD54F"/>
<text x="806" y="321" fill="#FFD54F" font-size="10.5">← 冷落兜底：强制入必抽池</text>
<text x="512" y="342" fill="#9A9AAE" font-size="10.5">绿 = 欠（抽少了，优先补偿） · 红 = 超（抽多了）</text>

<!-- 底部参数条 -->
<rect x="30" y="356" width="940" height="0" fill="none"/>
<text x="30" y="372" fill="#9A9AAE" font-size="11">β = 2.5（公平 ⇄ 不可预测旋钮） · W = ⌈1.5N⌉ 硬兜底 · 实测 N=10 连续抽 1000 次，每人 99~101 次，最大偏差 ≤ 1</text>
</svg>
