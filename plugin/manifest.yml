name: YRANDOM
id: ima.yrand
icon: icon.png
description: YRANDOM 课堂随机点名。圆形悬浮窗，点一下开始抽选：先匀速滚动，时间到定下一位；再按滑动概率决定是否在随机时间内自动选定下一位。v2.0.0.10 起采用债务校正公平算法（任意窗口内每人被抽次数与均分的差有界）、麦克风声浪加成连滑概率、指纹公示与种子可复算验证。名单内相同名字自动合并，防止重名刷概率。v2.0.0.11 起统一 Fluent 抽签图标标识；v2.0.0.12 起麦克风声浪加成可在设置页配置；v2.0.0.13 恢复滚动换名展示与两段式连抽节奏；v2.0.0.14 起过程状态统一显示「抽取中」；v2.0.0.15 修复快速滚动时重复弹窗：整套抽选只注册一条过程通知，滚动与定格换名均为原地属性更新，绝不再触发新弹窗。v2.0.0.16 新增插件更新提示（走国内发布台静默检查，空闲时才提醒）与匿名用户数量统计（每日一次、无任何个人信息，均可关闭）。v2.0.0.17 悬浮窗默认位置改为屏幕右端中间、拖动改为长按 2 秒后进入拖动模式，并接入 Sentry 崩溃上报（已内置 DSN 开箱上报，可整体关闭）。v2.0.0.18 为规避 GitHub 仓库风控，插件由 YRAND 更名为 YRANDOM（仅显示名，插件 id 与设置数据不变，老版本覆盖安装后设置与公平账本全部保留）。v2.0.0.19 修复长按拖动失效（放宽取消阈值、拖动期间暂停置顶维持、捕获丢失自动复位），并将更新提示从通知流改为独立可关闭窗口，附发布台直达链接。
