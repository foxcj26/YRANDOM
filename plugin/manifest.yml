entranceAssembly: ClassIsland.YRAND.dll
name: YRAND
id: ima.yrand
icon: icon.png
description: YRAND 课堂随机点名。圆形悬浮窗，点一下开始抽选：先匀速滚动，时间到定下一位；再按滑动概率决定是否在随机时间内自动选定下一位。v2.0.0.10 起采用债务校正公平算法（任意窗口内每人被抽次数与均分的差有界）、麦克风声浪加成连滑概率、指纹公示与种子可复算验证。名单内相同名字自动合并，防止重名刷概率。v2.0.0.11 起统一 Fluent 抽签图标标识；v2.0.0.12 起麦克风声浪加成可在设置页配置；v2.0.0.13 恢复滚动换名展示与两段式连抽节奏；v2.0.0.14 起过程状态统一显示「抽取中」；v2.0.0.15 修复快速滚动时重复弹窗：整套抽选只注册一条过程通知，滚动与定格换名均为原地属性更新，绝不再触发新弹窗。
