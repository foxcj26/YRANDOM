name: Build YRAND

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/ClassIsland.YRAND/ClassIsland.YRAND.csproj

      - name: Build
        run: dotnet build src/ClassIsland.YRAND/ClassIsland.YRAND.csproj -c Release --no-restore

      - name: Pack .cipx
        run: python3 scripts/pack.py --output dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YRAND-cipx
          path: dist/*.cipx
          if-no-files-found: error
